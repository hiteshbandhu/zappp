name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Apple Silicon runner: zappp is macOS-only and uses CoreML / AppKit.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      - name: Build the app bundle
        run: ZAPPP_SIGN_IDENTITY=- scripts/bundle.sh
